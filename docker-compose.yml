version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: plastify_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plastify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plastify_password}
      POSTGRES_DB: ${POSTGRES_DB:-plastify_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plastify_user} -d ${POSTGRES_DB:-plastify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - plastify_net

  # ----------------------------------------------------------------------------
  # Redis Cache & Message Broker Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: plastify_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - plastify_net

  # ----------------------------------------------------------------------------
  # FastAPI API Modular Monolith Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plastify_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - plastify_net

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Task Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: plastify_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - plastify_net

volumes:
  postgres_data:
    name: plastify_postgres_data
  redis_data:
    name: plastify_redis_data

networks:
  plastify_net:
    name: plastify_network
    driver: bridge

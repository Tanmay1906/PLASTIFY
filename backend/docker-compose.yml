version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: plastify_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plastify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plastify_password}
      POSTGRES_DB: ${POSTGRES_DB:-plastify_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plastify_user} -d ${POSTGRES_DB:-plastify_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - plastify_net

  redis:
    image: redis:7-alpine
    container_name: plastify_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - plastify_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plastify_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - plastify_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: plastify_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped
    networks:
      - plastify_net

  minio:
    image: minio/minio:latest
    container_name: plastify_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - plastify_net

volumes:
  postgres_data:
    name: plastify_postgres_data
  redis_data:
    name: plastify_redis_data
  minio_data:
    name: plastify_minio_data

networks:
  plastify_net:
    name: plastify_network
    driver: bridge
